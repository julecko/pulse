# Default server config, used automatically in debug builds when running
# from the workspace root (see pulse-shared::config::default_path).
# In release builds this has no effect; the real file lives at
# /etc/pulse-server/server.toml instead.

[log]
# error | warn | info | debug | trace, or any RUST_LOG-style filter string.
# RUST_LOG, if set, overrides this.
level = "warn,pulse_serverd=debug"

# Explicit log file path. Leave unset: stdout in debug, /var/log/pulse-server/server.log
# in release.
# file = "/var/log/pulse-server/server.log"

# ANSI colours; only applies when writing to a terminal.
ansi = true

# How often to start a new log file: daily | hourly | minutely | never.
rotation = "daily"

# Keep at most this many rotated log files, deleting the oldest (0 = keep all).
keep_files = 10

[web]
# Address the HTTPS listener binds to.
bind = "0.0.0.0:8443"

# How long a user session from POST /auth/login stays valid, in hours.
session_ttl_hours = 168

[web.rate_limit]
# Per client IP (IPv6: per /64), for the routes anyone can reach. A client
# over the limit gets 429 with Retry-After. 0 disables a limit, e.g. behind
# a reverse proxy (all requests come from its IP; rate-limit there instead).
# Failed logins (successful ones don't count).
login_failures_per_minute = 5
# Failed logins per username, from any IP: throttles guessing from many
# addresses. It slows logins down but never locks the account.
login_failures_per_user_per_minute = 5
# Agent pairing polls. Every agent polls once a minute, even after approval,
# so this also caps how many agents can share one public IP (e.g. NAT).
pair_per_minute = 30
# Per agent, for the routes approved agents send data to, so one agent (or
# a stolen agent secret) can't flood the database. Metrics: agents send one
# snapshot per interval_secs (default 60), so 4 allows intervals down to 15s.
metrics_per_agent_per_minute = 4
# PAM events (logins, failed auth); generous for a host under SSH brute force.
auth_events_per_agent_per_minute = 300
# Plain push notifications from `pulse-agent-cli notify`.
notifications_per_agent_per_minute = 10

[web.connections]
# Caps on open connections; a client over a cap is disconnected right away.
# 0 disables a cap. Behind a reverse proxy every client shares the proxy's
# IP, so raise or disable max_per_ip there.
max = 4096
# Per client IP (IPv6: per /64). Each agent keeps about one open, so this
# also caps how many agents can share one public IP (e.g. NAT).
max_per_ip = 64

[web.tls]
# Explicit cert/key paths. Leave unset: ./certs/{cert,key}.pem in debug,
# /etc/pulse-server/certs/{cert,key}.pem in release.
# cert = "/etc/pulse-server/certs/cert.pem"
# key = "/etc/pulse-server/certs/key.pem"

[db]
# Explicit SQLite database file. Leave unset: ./data/server.db in debug,
# /var/lib/pulse-server/server.db in release.
# path = "/var/lib/pulse-server/server.db"

[retention]
# How many days of rows to keep; older rows are deleted on startup and then
# hourly. 0 keeps rows forever. Defaults: `pulse-server-cli retention set`
# overrides them at runtime, until `retention reset`.
metrics_days = 14
auth_events_days = 14
# Resolved alerts, by when they resolved; active alerts are always kept.
alerts_days = 90

[push]
# Firebase service account JSON key (Firebase console > Project settings >
# Service accounts > Generate new private key), for pushing alerts from rules
# with `notify` to the mobile app. Leave unset to disable pushes; alerts are
# still recorded. Keep it readable only by the pulse-server group: it can
# send pushes as your Firebase project.
# fcm_service_account = "/etc/pulse-server/fcm-service-account.json"
