[package]
name = "pulse-shared"
version = "1.3.0"
edition = "2024"

[features]
# argon2 password hashing (`pulse_shared::password`); server + server-cli only.
password = ["dep:argon2", "dep:password-hash"]
# Agent identity and PAM socket path (`pulse_shared::agent`); agentd +
# agent-cli only.
agent = ["dep:protocol", "dep:getrandom", "dep:libc"]

[dependencies]
argon2 = { version = "0.5", optional = true }
getrandom = { version = "0.4", optional = true }
libc = { version = "0.2", optional = true }
password-hash = { version = "0.5", features = ["getrandom"], optional = true }
protocol = { path = "../protocol", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"
toml = "1.1.6"
