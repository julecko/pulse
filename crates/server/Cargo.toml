[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
protocol = { path = "../protocol", features = ["async"] }
pulse-config = { path = "../pulse-config" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "macros", "io-util"] }
tracing = "0.1"
