[package]
name = "server"
version = "0.1.0"
edition = "2024"
description = "pulse metrics server — ingests agent reports over TCP"
license-file = "../../LICENSE"
authors = ["Julecko <julecko@dilino.sk>"]
publish = false

[lib]
name = "pulse_server"

# bins: src/bin/pulse-serverd.rs (daemon), src/bin/pulse-server.rs (front-end)

[dependencies]
protocol = { path = "../protocol", features = ["async"] }
pulse-config = { path = "../pulse-config" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "macros", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing = "0.1"

[package.metadata.deb]
name = "pulse-server"
maintainer = "Julecko <julecko@dilino.sk>"
copyright = "2026, Julecko <julecko@dilino.sk>"
license-file = ["../../LICENSE", "0"]
extended-description = """
Single-threaded async TCP server that accepts length-prefixed MessagePack
metric reports from pulse agents, keyed by a stable per-machine id.
"""
depends = "$auto"
section = "net"
priority = "optional"
assets = [
    ["target/release/pulse-serverd", "usr/lib/pulse/pulse-serverd", "755"],
    ["target/release/pulse-server", "usr/bin/pulse-server", "755"],
    ["../../packaging/server.toml", "etc/pulse/server.toml", "644"],
    ["../../packaging/README.md", "usr/share/doc/pulse-server/README.md", "644"],
]
conf-files = ["/etc/pulse/server.toml"]
# packaging/deb/server/postinst creates the `pulse` user; cargo-deb appends the
# systemd fragments (from systemd-units below) at the `#DEBHELPER#` marker.
maintainer-scripts = "../../packaging/deb/server"
systemd-units = { unit-name = "pulse-server", unit-scripts = "../../packaging", enable = false, start = false }
