[package]
name = "agent-cli"
version = "0.1.0"
edition = "2024"
description = "pulse-agent — config & control front-end for pulse-agentd"
license-file = "../../LICENSE"
authors = ["Julecko <julecko@dilino.sk>"]
publish = false

[[bin]]
name = "pulse-agent"
path = "src/main.rs"

[dependencies]
pulse-cli = { path = "../pulse-cli" }
agent = { path = "../agent" }
protocol = { path = "../protocol" }
pulse-config = { path = "../pulse-config" }
clap = { version = "4", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sysinfo = "0.38.4"
