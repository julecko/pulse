# pulse server config — install to /etc/pulse/server.toml
# (debug builds instead read ./server.toml next to the executable)

# Address the TCP listener binds to.
bind = "0.0.0.0:9000"

# Mutual TLS 1.3. Set by `pulse-server cert generate` + `cert approve`; leave
# false for a plaintext, unauthenticated link. When true, the daemon reads
# server.crt / server.key / trusted-agents/ from the tls/ subfolder of this
# directory and only accepts clients presenting an approved certificate.
tls = false

[limits]
# Connections handled at once (0 = unlimited). Excess is dropped.
max_connections = 1024
# New connections accepted from one source IP per minute (0 = off).
per_ip_per_minute = 600
# Seconds a connection may take (TLS handshake + one report) before it is
# dropped (0 = no timeout).
connection_timeout_secs = 15

[storage]
# Persist every received report to a local SQLite database so history survives
# restarts. Disable to keep only the in-memory view.
enabled = true
# Database file. Empty => /var/lib/pulse/history.db (the systemd StateDirectory);
# next to the executable in debug builds.
path = ""
# Days of history to keep. Rows older than this are pruned automatically.
retention_days = 7
# How often the pruner runs, in seconds (minimum 60).
prune_interval_secs = 3600

[log]
# error | warn | info | debug | trace  (RUST_LOG overrides this when set)
level = "info"
# Explicit log file. If unset: stderr in debug, /var/log/pulse/server.log in release.
# file = "/var/log/pulse/server.log"
ansi = false
# Start a new file every: daily | hourly | minutely | never.
# Rotated files get a date suffix, e.g. server.2026-09-03.log
rotation = "daily"
# Keep at most this many rotated files (oldest deleted). 0 = keep all.
# With rotation = "daily", ~= days of history.
keep_files = 10
