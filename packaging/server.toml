# pulse server config — install to /etc/pulse/server.toml
# (debug builds instead read ./server.toml next to the executable)

# Address the TCP listener binds to.
bind = "0.0.0.0:9000"

[log]
# error | warn | info | debug | trace  (RUST_LOG overrides this when set)
level = "info"
# Explicit log file. If unset: stderr in debug, /var/log/pulse/server.log in release.
# file = "/var/log/pulse/server.log"
ansi = false
# Start a new file every: daily | hourly | minutely | never.
# Rotated files get a date suffix, e.g. server.2026-09-03.log
rotation = "daily"
# Keep at most this many rotated files (oldest deleted). 0 = keep all.
# With rotation = "daily", ~= days of history.
keep_files = 10
