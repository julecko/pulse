# pulse agent config — install to /etc/pulse/agent.toml
# (debug builds instead read ./agent.toml next to the executable)

# host:port of the pulse server to ship reports to.
server = "127.0.0.1:9000"

# How often to collect and send a report, in seconds.
interval_secs = 5

[log]
# error | warn | info | debug | trace  (RUST_LOG overrides this when set)
level = "info"
# Explicit log file. If unset: stderr in debug, /var/log/pulse/agent.log in release.
# file = "/var/log/pulse/agent.log"
ansi = false
# Start a new file every: daily | hourly | minutely | never.
# Rotated files get a date suffix, e.g. agent.2026-09-03.log
rotation = "daily"
# Keep at most this many rotated files (oldest deleted). 0 = keep all.
# With rotation = "daily", ~= days of history.
keep_files = 10
