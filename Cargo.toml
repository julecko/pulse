[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Password hashing is unusably slow unoptimized (~1s per login in debug).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[workspace]
members = [
    "crates/agent",
    "crates/server",
    "crates/server-cli",
    "crates/protocol",
    "crates/pulse-shared",
]
resolver = "3"
